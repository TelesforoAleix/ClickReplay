<text x="470.0" y="294.0" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" fill="#656560" text-anchor="middle">events + timing</text>
<text x="390" y="340" font-family='"SFMono-Regular", Consolas, monospace' font-size="14" letter-spacing="1" fill="#FF4D00" text-anchor="start">EDIT BY HAND</text>
