<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
<title id="t">ClickReplay: record, edit, replay</title>
<desc id="d">The CLI or the GUI, sharing config.ini, starts recording or replay. Mouse and keyboard input is recorded to editable JSON, replayed with monitor scaling to the screen, and captured by an external screen recorder.</desc>
