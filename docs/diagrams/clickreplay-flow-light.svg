<text x="790" y="204" font-family='"SFMono-Regular", Consolas, monospace' font-size="14" letter-spacing="1" fill="#656560" text-anchor="start">OUTSIDE CLICKREPLAY</text>
<rect x="410" y="34" width="120" height="36" rx="3" ry="3" fill="#F2F2EF" stroke="#171717" stroke-width="1"/>
<text x="470.0" y="57.0" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="15" font-weight="600" fill="#171717" text-anchor="middle">config.ini</text>
<path d="M470,70 L470,84 M390,84 L550,84 M390,84 L390,100 M550,84 L550,100" fill="none" stroke="#656560" stroke-width="1"/>
<text x="560" y="58" font-family='"SFMono-Regular", Consolas, monospace' font-size="14" letter-spacing="1" fill="#656560" text-anchor="start">SHARED SETTINGS</text>
