<text x="670.0" y="272.0" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="16" font-weight="600" fill="#171717" text-anchor="middle">Replay</text>
<text x="670.0" y="294.0" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" fill="#656560" text-anchor="middle">monitor scaling</text>
