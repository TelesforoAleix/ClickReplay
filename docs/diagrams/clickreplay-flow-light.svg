<rect x="0" y="0" width="1200" height="400" fill="#F2F2EF"/>
<line x1="24" y1="20" x2="1176" y2="20" stroke="#CDCDC7" stroke-width="1"/>
<line x1="24" y1="178" x2="1176" y2="178" stroke="#CDCDC7" stroke-width="1"/>
<line x1="24" y1="382" x2="1176" y2="382" stroke="#CDCDC7" stroke-width="1"/>
<text x="24" y="46" font-family='"SFMono-Regular", Consolas, monospace' font-size="14" letter-spacing="1" fill="#656560" text-anchor="start">01 ENTRY</text>
<text x="24" y="204" font-family='"SFMono-Regular", Consolas, monospace' font-size="14" letter-spacing="1" fill="#656560" text-anchor="start">02 FLOW</text>
