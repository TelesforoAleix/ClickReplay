<rect x="970" y="238" width="160" height="76" rx="3" ry="3" fill="#F2F2EF" stroke="#171717" stroke-width="1"/>
<text x="1050.0" y="272.0" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="16" font-weight="600" fill="#171717" text-anchor="middle">Screen recorder</text>
<text x="1050.0" y="294.0" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" fill="#656560" text-anchor="middle">captures the take</text>
<text x="970" y="340" font-family='"SFMono-Regular", Consolas, monospace' font-size="14" letter-spacing="1" fill="#656560" text-anchor="start">OBS OR SIMILAR</text>
